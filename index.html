    const st=decideResolution(r);
    save();render();refreshPreview();updateLive();
    toast(st==='przyjeta'?'Uchwała przyjęta, nadano numer '+r.num+'/'+r.year+'.':'Wniosek odrzucony – uchwała nie powstała.');
  },
  reopen(){
    const r=getRec();if(!r)return;r.status='wniosek';r.za='';r.przeciw='';r.wstrz='';r.num='';r.numT=false;
    save();render();refreshPreview();updateLive();toast('Wniosek otwarty ponownie do głosowania.');
  },
  votecast(el){
    const r=el.dataset.id?db.resolutions.find(x=>x.id===el.dataset.id):getRec();if(!r){toast('Otwórz uchwałę, żeby zagłosować.');return;}
    if(curMember()&&!canVote(curMember(),r)){toast('Nie bierzesz udziału w tym głosowaniu.');return;}
    if(!r.poll||!r.poll.open){toast('Głosowanie nie jest aktywne.');return;}
    const me=curMember();if(!me){toast('Twoje konto nie jest przypisane do członka Rady.');return;}
    r.poll.votes=r.poll.votes||{};r.poll.votes[me.id]=el.dataset.v;
    save();render();toast('Głos zapisany.');
  },
  login(){
    const pin=String(ui.voterPinInput||'').trim();
    if(!pin){toast('Wpisz swój PIN.');return;}
    const m=db.members.find(x=>x.pin&&String(x.pin)===pin);
    if(!m){toast('Nieprawidłowy PIN.');return;}
    ui.voterId=m.id;saveVoterId(m.id);ui.voterPinInput='';render();toast('Zalogowano jako '+m.name+'.');
  },
  logout(){if(window.__fbSignOut)window.__fbSignOut();},
  claimadmin(){
    const m=db.members.find(x=>x.id===db.settings.adminId);
    if(!m||m.pin){toast('To już nie jest możliwe.');return;}
    ui.voterId=m.id;saveVoterId(m.id);render();toast('Zalogowano jako '+m.name+'. Ustaw swój PIN w zakładce Członkowie.');
  },
  setadmin(el){
    if(!isAdmin())return;
    db.settings.adminId=el.dataset.id;save();render();toast('Administrator zmieniony.');
  },
  del(){
    if(ui.confirm!=='rec'){ui.confirm='rec';render();return;}
    const e=ui.editing,c=coll(e.kind),i=c.findIndex(x=>x.id===e.id);if(i>=0)c.splice(i,1);
    if(e.kind==='resolution')db.meetings.forEach(m=>{m.resIds=(m.resIds||[]).filter(id=>id!==e.id);});
    save();ui.editing=null;ui.confirm=null;render(false);window.scrollTo(0,0);toast('Usunięto.');
  },
  delcancel(){ui.confirm=null;render();},
  addmember(){
    if(!isAdmin())return;
    const m={id:uid(),name:'',func:'Przedstawiciel klasy',cls:'',g:'f',pin:'',canEdit:false};db.members.push(m);save();ui.focusBind=null;render();
    const el=$app.querySelector('[data-root="member:'+m.id+'"] input');if(el)el.focus();
  },
  delmember(el){
    if(!isAdmin())return;
    const id=el.dataset.id;if(id===db.settings.adminId)return;
    if(ui.confirm!=='m'+id){ui.confirm='m'+id;render();return;}
    db.members=db.members.filter(x=>x.id!==id);db.meetings.forEach(m=>{if(m.att)delete m.att[id];});
    if(ui.voterId===id){ui.voterId='';saveVoterId('');}
    save();ui.confirm=null;render();
  },
  delmembercancel(){ui.confirm=null;render();},
  calprev(){const y=+ui.calM.slice(0,4),m=+ui.calM.slice(5,7)-2;const d=new Date(y,m,1);ui.calM=d.getFullYear()+'-'+pad(d.getMonth()+1);render();},
  calnext(){const y=+ui.calM.slice(0,4),m=+ui.calM.slice(5,7);const d=new Date(y,m,1);ui.calM=d.getFullYear()+'-'+pad(d.getMonth()+1);render();},
  calday(el){ui.calDay=ui.calDay===el.dataset.v?null:el.dataset.v;render();},
  evnew(el){if(!canPlan())return;ui.evDraft={id:'',title:'',type:'impreza',date:(el&&el.dataset.v)||ui.calDay||todayISO(),dateEnd:'',time:'',place:'',desc:''};ui.focusBind='title';render();window.scrollTo(0,0);},
  evedit(el){if(!canPlan())return;const e=(db.events||[]).find(x=>x.id===el.dataset.id);if(!e)return;ui.evDraft=Object.assign({},e);render();window.scrollTo(0,0);},
  evcancel(){ui.evDraft=null;render();},
  evsave(){
    if(!canPlan())return;const d=ui.evDraft;if(!d)return;
    if(!String(d.title||'').trim()){toast('Wpisz nazwę wydarzenia.');return;}
    if(!d.date){toast('Wybierz datę.');return;}
    const rec={id:d.id||uid(),title:String(d.title).trim(),type:d.type||'impreza',date:d.date,dateEnd:d.dateEnd&&d.dateEnd>d.date?d.dateEnd:'',time:d.time||'',place:String(d.place||'').trim(),desc:String(d.desc||'').trim(),author:(curMember()||{}).name||''};
    db.events=db.events||[];const i=db.events.findIndex(x=>x.id===rec.id);
    if(i>=0)db.events[i]=rec;else db.events.push(rec);
    ui.evDraft=null;ui.calM=rec.date.slice(0,7);ui.calDay=rec.date;save();render();toast(i>=0?'Zapisano zmiany.':'Dodano do kalendarza.');
    if(i<0)notifyEvent(rec);
  },
  evdel(el){if(!canPlan())return;const id=el.dataset.id;if(ui.confirm!=='e'+id){ui.confirm='e'+id;render();return;}db.events=(db.events||[]).filter(x=>x.id!==id);ui.confirm=null;save();render();toast('Usunięto wydarzenie.');},
  evhelp(el){
    const me=curMember();if(!me){toast('Zaloguj się swoim PIN-em, aby zgłosić pomoc.');return;}
    const id=el.dataset.id,e=(db.events||[]).find(x=>x.id===id);if(!e)return;
    e.help=e.help||{};
    if(e.help[me.id])delete e.help[me.id];else e.help[me.id]=true;
    save();render();
  },
  evitemxls(el){
    const id=el.dataset.id,e=(db.events||[]).find(x=>x.id===id);if(!e)return;
    const rows0=evContribRows(e).filter(r=>String(r.v.babeczki||'').trim()||String(r.v.ciasto||'').trim()||String(r.v.inne||'').trim());
    if(!rows0.length){toast('Brak zgłoszeń do pobrania.');return;}
    const rows=[['Klasa','Babeczki','Ciasta','Inne']].concat(rows0.map(r=>[r.cls,r.v.babeczki||'',r.v.ciasto||'',r.v.inne||'']));
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    saveFile(blob,asciiName('Zgloszenia_'+e.title+'_'+e.date)+'.csv');
  },
  evitemdoc(el){
    const id=el.dataset.id,e=(db.events||[]).find(x=>x.id===id);if(!e)return;
    const rows0=evContribRows(e).filter(r=>String(r.v.babeczki||'').trim()||String(r.v.ciasto||'').trim()||String(r.v.inne||'').trim());
    if(!rows0.length){toast('Brak zgłoszeń do pobrania.');return;}
    const model=[{k:'header',text:db.settings.school},{k:'title',text:'Lista zgłoszeń – '+e.title},
      {k:'p',text:'Termin: '+fmtDate(e.date)+(e.place?', miejsce: '+e.place:'')},
      {k:'table',widths:[25,25,25,25],head:['Klasa','Babeczki','Ciasta','Inne'],rows:rows0.map(r=>[r.cls,r.v.babeczki||'',r.v.ciasto||'',r.v.inne||'']),aligns:['left','center','center','left']}];
    saveDocx(model,'Lista zgłoszeń',asciiName('Zgloszenia_'+e.title+'_'+e.date)+'.docx');
  },
  duesaddrow(){
    if(locked())return;
    db.duesStats=db.duesStats||[];
    db.duesStats.push({id:uid(),cls:'',students:'',paid:'',year:viewYear});
    save();render();
  },
  duesdelrow(el){
    if(locked())return;
    const id=el.dataset.id;
    db.duesStats=(db.duesStats||[]).filter(x=>x.id!==id);
    save();render();
  },
  annnew(){if(!canPlan())return;ui.annDraft={text:'',until:''};ui.focusBind='text';render();},
  anncancel(){ui.annDraft=null;render();},
  annsave(){
    if(!canPlan())return;const d=ui.annDraft;if(!d||!String(d.text||'').trim()){toast('Wpisz treść ogłoszenia.');return;}
    db.ann=db.ann||[];db.ann.push({id:uid(),text:String(d.text).trim(),until:d.until||'',author:(curMember()||{}).name||'',created:new Date().toISOString()});
    ui.annDraft=null;save();render();toast('Ogłoszenie opublikowane.');
  },
  anndel(el){if(!canPlan())return;const id=el.dataset.id;if(ui.confirm!=='a'+id){ui.confirm='a'+id;render();return;}db.ann=(db.ann||[]).filter(x=>x.id!==id);ui.confirm=null;save();render();toast('Usunięto ogłoszenie.');},
  addnote(){
    if(!canAddNotes())return;
    const d=ui.noteDraft||{};
    if(!String(d.text||'').trim()){toast('Napisz treść notatki.');return;}
    const me=curMember();
    const author=me?me.name:String(d.author||'').trim();
    if(!me)saveAuthorPref(d.author||'');
    db.notes=db.notes||[];
    db.notes.push({id:uid(),author:author,ref:String(d.ref||'').trim(),text:String(d.text||'').trim(),done:false,created:new Date().toISOString(),memberId:me?me.id:null});
    ui.noteDraft={author:d.author||'',ref:'',text:''};
    save();render();toast('Dodano notatkę.');
  },
  notedone(el){if(!canSeeNotes())return;const n=(db.notes||[]).find(x=>x.id===el.dataset.id);if(!n)return;n.done=!n.done;save();render();},
  delnote(el){
    if(!canSeeNotes())return;
    const id=el.dataset.id;if(ui.confirm!=='n'+id){ui.confirm='n'+id;render();return;}
    db.notes=(db.notes||[]).filter(x=>x.id!==id);save();ui.confirm=null;render();
  },
  delnotecancel(){ui.confirm=null;render();},
  backup(){saveFile(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),'kopia-rada-rodzicow-'+todayISO()+'.json');},
  importpick(){document.getElementById('fileimp').click();},
  attpick(){document.getElementById('attimp').click();},
  attdel(el){
    const r=getRec();if(!r||!r.attachments)return;
    const id=el.dataset.id;
    getAssets().then(assets=>{if(assets&&typeof assets.delete==='function')return assets.delete(id).catch(()=>{});}).catch(()=>{}).finally(()=>{
      r.attachments=r.attachments.filter(a=>a.id!==id);save();render();refreshPreview();
    });
  },
  importok(){
    const d=ui.pendingImport;if(!d)return;const b=defaults();
    db={v:1,flags:d.flags||{},settings:Object.assign(b.settings,d.settings||{}),members:d.members,meetings:d.meetings,resolutions:fixResYears(d.resolutions),reports:d.reports,notes:d.notes||[],docs:d.docs||[],events:d.events||[],ann:d.ann||[]};
    ui.pendingImport=null;save();render();toast('Kopia wczytana.');
  },
  importcancel(){ui.pendingImport=null;render();},
  seedno(){db.flags.seed20='no';save();render();},
  seed20(){
    let n=0;
    SEED20.forEach(x=>{
      if(db.resolutions.some(r=>num(r.kwota)===num(x[0])&&r.cel===x[1]))return;
      db.resolutions.push({id:uid(),status:'przyjeta',num:'',year:viewYear,date:'',mode:'wydatek',subject:'pokrycia kosztów '+x[1],subjT:true,kwota:x[0],cel:x[1],text:'',body:'prezydium',elig:db.settings.presidium,za:'',przeciw:'',wstrz:'',manual:true,wejscie:'Uchwała weszła w życie z dniem jej podpisania.'});n++;
    });
    db.flags.seed20='yes';save();render();toast('Dodano uchwał: '+n+'. Wpisz daty w każdej z nich.');
  },
  bulkopen(){ui.bulk={text:'',date:todayISO()};render();},
  bulkcancel(){ui.bulk=null;render();},
  bulkselon(el){ui.sel={kind:el.dataset.kind,ids:[]};ui.confirm=null;render();},
  bulkselcancel(){ui.sel=null;ui.confirm=null;render();},
  selrow(el){
    if(!ui.sel)return;const id=el.dataset.id,i=ui.sel.ids.indexOf(id);
    if(i>=0)ui.sel.ids.splice(i,1);else ui.sel.ids.push(id);
    render();
  },
  bulkdel(){
    if(!ui.sel||!ui.sel.ids.length)return;
    if(ui.confirm!=='bulkdel'){ui.confirm='bulkdel';render();return;}
    const kind=ui.sel.kind,ids=new Set(ui.sel.ids),n=ids.size;
    if(kind==='meeting')db.meetings=db.meetings.filter(m=>!ids.has(m.id));
    else if(kind==='resolution'){db.resolutions=db.resolutions.filter(r=>!ids.has(r.id));db.meetings.forEach(m=>{m.resIds=(m.resIds||[]).filter(id=>!ids.has(id));});}
    ui.sel=null;ui.confirm=null;save();render();window.scrollTo(0,0);toast('Usunięto: '+n+'.');
  },
  bulkdelcancel(){ui.confirm=null;render();},
  bulkok(){
    const it=parseBulk(ui.bulk.text);if(!it.length){toast('Wklej najpierw listę.');return;}
    const date=ui.bulk.date||todayISO(),year=syStart(date);
    it.forEach(x=>{
      const cel='„'+x.desc+'”';
      db.resolutions.push({id:uid(),status:'przyjeta',num:nextNum(year),year:year,date:date,mode:'wydatek',subject:'pokrycia kosztów '+cel,subjT:true,kwota:x.kwota,cel:cel,text:'',body:'prezydium',elig:db.settings.presidium,za:'',przeciw:'',wstrz:'',manual:true,wejscie:'Uchwała weszła w życie z dniem jej podpisania.'});
    });
    save();ui.bulk=null;render();toast('Dodano uchwał: '+it.length+'. Sprawdź daty i nazwy.');
  }
};
const VIEW_SAFE=new Set(['calprev','calnext','calday','tab','open','back','seg','dl','dlatt','dlall','yprev','ynext','yall','login','logout','claimadmin']);
const LOCKED_SAFE=new Set(['mailtest','evnew','evedit','evcancel','evsave','evdel','evhelp','evitemxls','evitemdoc','annnew','anncancel','annsave','anndel','addnote','notedone','delnote','delnotecancel','votecast']);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(ui.readOnly&&!VIEW_SAFE.has(act))return;
  if(!ui.readOnly&&locked()&&!VIEW_SAFE.has(act)&&!LOCKED_SAFE.has(act))return;
  const f=ACTIONS[act];if(!f)return;
  try{f(el,e);}
  catch(err){console.error(err);toast('Błąd: '+(err&&err.message?err.message:String(err)));}
});
window.addEventListener('error',e=>{try{toast('Błąd aplikacji: '+(e.message||'nieznany'));}catch(x){}});
window.addEventListener('unhandledrejection',e=>{try{toast('Błąd aplikacji: '+((e.reason&&e.reason.message)||String(e.reason)));}catch(x){}});

$app.innerHTML='<div style="padding:60px 20px;text-align:center;color:var(--muted);font-weight:700">Wczytywanie…</div>';
boot();
})();
</script>
</body>
</html>
