<!doctype html>
<html lang="pl" translate="no">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Dokumenty Rady Rodziców</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F3FA;--surface:#FFFFFF;--ink:#34324A;--muted:#6E6B85;--line:#E4E0F2;--field:#FBFAFE;
  --primary:#6A5CC4;--primary-ink:#FFFFFF;
  --lav:#E6E1FA;--lav-d:#5648AE;--mint:#D8F0E4;--mint-d:#2A7657;--peach:#FFE3D4;--peach-d:#9C4B29;
  --butter:#FFF1C7;--butter-d:#725A0C;--rose:#FADBE6;--rose-d:#9B3560;--sky:#DCEBFC;--sky-d:#265C94;
  --lemon:#EAF2C8;--lemon-d:#596B1C;
  --shadow:0 1px 2px rgba(60,50,110,.06),0 8px 24px rgba(60,50,110,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1A29;--surface:#272538;--ink:#ECEAF8;--muted:#A6A3BF;--line:#3A3752;--field:#211F31;
    --primary:#9285EB;--primary-ink:#1C1A29;
    --lav:#3A3466;--lav-d:#D2CBFF;--mint:#1F3B31;--mint-d:#A0E4C5;--peach:#48301F;--peach-d:#FFC9A8;
    --butter:#463B17;--butter-d:#F6DE8B;--rose:#4A2635;--rose-d:#F7B7CD;--sky:#203A52;--sky-d:#9CC4EE;
    --lemon:#323D14;--lemon-d:#D6E79A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1A29;--surface:#272538;--ink:#ECEAF8;--muted:#A6A3BF;--line:#3A3752;--field:#211F31;
  --primary:#9285EB;--primary-ink:#1C1A29;
  --lav:#3A3466;--lav-d:#D2CBFF;--mint:#1F3B31;--mint-d:#A0E4C5;--peach:#48301F;--peach-d:#FFC9A8;
  --butter:#463B17;--butter-d:#F6DE8B;--rose:#4A2635;--rose-d:#F7B7CD;--sky:#203A52;--sky-d:#9CC4EE;
  --lemon:#323D14;--lemon-d:#D6E79A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
#app{display:flex;flex-direction:column;min-height:100vh}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:6px 16px 130px}
.k-pulpit{--kc:var(--sky);--kd:var(--sky-d)}
.k-meeting{--kc:var(--mint);--kd:var(--mint-d)}
.k-resolution{--kc:var(--lav);--kd:var(--lav-d)}
.k-report{--kc:var(--peach);--kd:var(--peach-d)}
.k-note{--kc:var(--lemon);--kd:var(--lemon-d)}
.k-member{--kc:var(--butter);--kd:var(--butter-d)}
.k-settings{--kc:var(--rose);--kd:var(--rose-d)}
.k-doc{--kc:var(--sky);--kd:var(--sky-d)}
.k-cal{--kc:var(--rose);--kd:var(--rose-d)}

.idrow{width:100%;max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.idpill{flex:none;background:var(--butter);color:var(--butter-d);font-size:12px;font-weight:800;border-radius:999px;padding:4px 11px;white-space:nowrap}
.idpill.ghost{background:var(--surface);color:var(--muted)}
.top{width:100%;max-width:1180px;margin:0 auto;padding:8px 16px 8px;display:flex;align-items:center;gap:12px}
.top .logo{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.top .logo img{height:34px;width:auto;display:block}
.top h1{font-size:20px}
.top p{margin:0;font-size:13px;color:var(--muted)}
.banner{margin:8px 16px;padding:10px 14px;border-radius:14px;background:var(--butter);color:var(--butter-d);font-size:14px;font-weight:600}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;letter-spacing:-.01em;font-weight:700;color:var(--muted);min-width:0}
.nav .lbl{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ic{width:44px;height:30px;border-radius:12px;display:grid;place-items:center}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.voteic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--kd)}
.nav button.on{color:var(--ink)}
.nav .ic{position:relative}
.nbadge{position:absolute;top:-4px;right:2px;min-width:18px;height:18px;border-radius:999px;background:#D93A3A;color:#fff;font:800 12px/18px Nunito,sans-serif;text-align:center;padding:0 4px;box-shadow:0 0 0 2px var(--surface)}
.vwarn{display:inline-flex;align-items:center;gap:6px;color:#C62F2F;font-weight:800}
.vwarn i{font-style:normal;width:22px;height:22px;border-radius:999px;background:#D93A3A;color:#fff;display:inline-grid;place-items:center;font-size:14px;flex:none}
.vdone{color:var(--mint-d);font-weight:800}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .dow{font-size:12px;font-weight:800;color:var(--muted);text-align:center;padding:2px 0}
.cday{min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;min-width:0;overflow:hidden}
.cday.out{opacity:.38}
.cday.today{border:2px solid var(--primary)}
.cday.pick{background:var(--kc)}
.cday .dn{font-size:12.5px;font-weight:800}
.cdot{display:block;font-size:11px;line-height:1.25;font-weight:700;border-radius:6px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdot.ev{background:var(--rose);color:var(--rose-d)}
.cdot.mt{background:var(--mint);color:var(--mint-d)}
.cdot.fr{background:var(--butter);color:var(--butter-d)}
@media (max-width:560px){.cday{min-height:48px}.cdot{font-size:0;height:7px;padding:0;border-radius:4px}}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead b{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600}
.evrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.evrow:first-child{border-top:0}
.evdate{flex:none;width:54px;border-radius:14px;background:var(--kc);color:var(--kd);text-align:center;padding:6px 0;line-height:1.1}
.evdate b{display:block;font-family:Fraunces,Georgia,serif;font-size:20px}
.evdate small{font-size:12px;font-weight:800}
.evdate.mt{background:var(--mint);color:var(--mint-d)}
.evdate.fr{background:var(--butter);color:var(--butter-d)}
.evbody{flex:1;min-width:0}
.evbody .t{font-weight:800}
.evbody .m{font-size:13.5px;color:var(--muted)}
.evbody .d{font-size:14.5px;margin-top:4px;white-space:pre-wrap}
.ann{background:var(--butter);color:var(--butter-d);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.ann .t{color:var(--ink);font-weight:600;white-space:pre-wrap;margin:2px 0 6px}
.ann .m{font-size:12.5px;font-weight:700}
.alertbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#FDE2E2;color:#9E2424;border-radius:16px;padding:12px 14px;margin:0 0 14px;font-weight:700}
.nav button.on .ic{background:var(--kc);color:var(--kd)}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0 14px;flex-wrap:wrap}
.pagehead h2{font-size:26px}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:700;font-size:15px;line-height:1.3}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.warn{background:var(--peach);border-color:var(--peach);color:var(--peach-d)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5}

.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.card h3{margin:0 0 10px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:21px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.card.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px}
.tile{flex:none;min-width:56px;height:56px;border-radius:16px;background:var(--kc);color:var(--kd);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;line-height:1.1}
.tile b{font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:600}
.tile small{font-size:12px;font-weight:700}
.tile.wide b{font-size:17px}
.rb{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{font-weight:800;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rs{font-size:13.5px;color:var(--muted)}
.chev{color:var(--muted);font-size:24px}
.selrow{cursor:pointer}
.selbox{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface)}
.selrow.checked{border-color:var(--ink,#1a1a1a);background:var(--kc)}
.selrow.checked .selbox{background:var(--ink,#1a1a1a);border-color:var(--ink,#1a1a1a);position:relative}
.selrow.checked .selbox::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.empty{text-align:center;padding:34px 18px;background:var(--surface);border:1.5px dashed var(--line);border-radius:20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px}
.fchip.on{background:var(--kc);border-color:var(--kc);color:var(--kd)}
.newcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:18px}
.newcards button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--kc);color:var(--kd);border:0;border-radius:18px;padding:14px 16px}
.newcards b{font-size:16px}
.newcards span{font-size:13.5px;opacity:.9}
.h3{font-size:16px;margin:22px 0 10px}

.editbar{display:flex;align-items:center;gap:12px;margin:10px 0 14px}
.editbar h2{font-size:22px;flex:1;min-width:0}
.edit{display:block}
.pane.prev{display:none}
.show-prev .pane.form{display:none}
.show-prev .pane.prev{display:block}
.form .card{margin-bottom:14px}
.form .card>h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.form .card>h3::before{content:"";width:10px;height:10px;border-radius:4px;background:var(--kd);opacity:.55}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;line-height:1.45}
input:disabled{opacity:.55}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.chk{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--primary);flex:none}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.lst{margin-bottom:6px}
.lh{font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.lrow{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.lrow textarea,.lrow input{flex:1;min-width:0}
.lrow .amt{flex:0 0 118px}
.ib{flex:none;width:44px;height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-size:22px;line-height:1;color:var(--muted)}
.attlist{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.attf{position:relative;display:flex;align-items:center}
.attf img{width:68px;height:68px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.attfile{display:flex;align-items:center;gap:6px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;font-weight:700;color:inherit;text-decoration:none;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attf .ib{position:absolute;top:-10px;right:-10px;width:28px;height:28px;font-size:16px;border-radius:999px;background:var(--rose);color:var(--rose-d);border-color:var(--rose-d)}
.att{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.att:first-of-type{border-top:0}
.att .who b{font-weight:800}
.att .who small{color:var(--muted);margin-left:6px}
.seg,.attc{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.attc button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--lav);border-color:var(--lav);color:var(--lav-d)}
.attc button.on.p{background:var(--mint);border-color:var(--mint);color:var(--mint-d)}
.attc button.on.n{background:var(--rose);border-color:var(--rose);color:var(--rose-d)}
.attc button.on.u{background:var(--butter);border-color:var(--butter);color:var(--butter-d)}
.counter{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-weight:800}
.vstat{display:inline-block;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;margin:0 0 6px}
.vstat.ok{background:var(--mint);color:var(--mint-d)}
.vstat.no{background:var(--rose);color:var(--rose-d)}
.vstat.wait{background:var(--butter);color:var(--butter-d)}
.rlink{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.rlink:first-of-type{border-top:0}
.rlink input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary);flex:none}
.moreacts{display:flex;gap:8px;flex-wrap:wrap}
.confirmrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.confirmrow .chint{font-size:13.5px;font-weight:700;color:var(--peach-d)}
.note.done{opacity:.6}
.nhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.nauthor{font-size:15px}
.nwhen{font-size:12.5px;color:var(--muted);flex:none}
.nref{display:inline-block;background:var(--kc);color:var(--kd);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;margin-bottom:8px}
.ntext{margin:0 0 10px;white-space:pre-wrap}
.member{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.member:first-of-type{border-top:0;padding-top:0;margin-top:0}
.member .g3{grid-template-columns:1.2fr 1fr 1fr}

.abar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.abar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}

.sheetwrap{background:var(--kc);border-radius:20px;padding:clamp(10px,3vw,22px)}
.sheet{background:#fff;color:#1a1a1a;font-family:"Times New Roman",Times,"Liberation Serif",serif;font-size:13.5px;line-height:1.45;padding:clamp(22px,5vw,44px) clamp(20px,5vw,46px);border-radius:3px;box-shadow:0 2px 4px rgba(60,50,110,.14),0 14px 36px rgba(60,50,110,.16);max-width:640px;margin:0 auto;min-height:440px}
.sheet .sh-logo{text-align:center}
.sheet .sh-logo img{height:62px;width:auto}
.sh-school{font-family:Calibri,Carlito,Arial,sans-serif;font-size:11px;text-align:center;margin:4px 0 14px}
.sh-title{font-family:Calibri,Carlito,Arial,sans-serif;font-weight:700;text-align:center;margin:10px 0}
.sh-subject{font-weight:700;margin:14px 0 16px 28px;text-align:justify}
.sh-p{margin:0 0 9px;text-align:justify}
.sh-h2{font-weight:700;margin:16px 0 6px}
.sh-list{margin:0 0 10px;padding-left:40px}
.sh-list li{margin-bottom:3px;text-align:justify}
.sh-list.dash{list-style:none}
.sh-list.dash li{position:relative}
.sh-list.dash li::before{content:"-";position:absolute;left:-16px}
.sh-sig{margin-top:26px}
.sh-sig .n{margin-top:2px}
.sh-sig2{display:flex;justify-content:space-between;gap:16px;margin-top:38px;text-align:center}
.sh-sig2>div{flex:1}
.sh-sig2 .dl{letter-spacing:1px;overflow:hidden;white-space:nowrap}
.sh-sig2 .lb{font-size:11.5px}
.sh-table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:12.5px}
.sh-table th,.sh-table td{border:1px solid #aaa;padding:4px 6px}
.sh-table th{background:#ededed}
.sh-sp{height:10px}
.sh-pb{border:0;border-top:2px dashed #ccc;margin:26px -10px}
.pnote{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0}

#authgate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#authgate .gbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;gap:12px}
#authgate .glogo{width:52px;height:52px;border-radius:16px;background:var(--lav);color:var(--lav-d);display:grid;place-items:center;font:600 20px Fraunces,Georgia,serif;margin:0 auto}
#authgate h1{font-size:22px;text-align:center}
#authgate .gsub{margin:0;text-align:center;color:var(--muted);font-weight:700}
#authgate label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
#authgate input{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
#authgate .gbtn{border:0;background:var(--primary);color:var(--primary-ink);border-radius:12px;padding:12px;font:800 16px Nunito,sans-serif;cursor:pointer}
#authgate .gbtn[disabled]{opacity:.6}
#authgate .gbtn2{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px;font:800 15px Nunito,sans-serif;cursor:pointer}

<script>
/* ===== Firebase: zamiast magazynu Claude (GitHub Pages + Firestore) ===== */
(function(){
  var cfg={
    apiKey:"AIzaSyBz5sdx3OKuTV6QsMFn1uQPxXzgKlyyG5c",
    authDomain:"rada-rodzicow-sp4.firebaseapp.com",
    projectId:"rada-rodzicow-sp4",
    storageBucket:"rada-rodzicow-sp4.firebasestorage.app",
    messagingSenderId:"10353536380",
    appId:"1:10353536380:web:479d2471ed5eb42dd4c8f9"
  };
  var fs=null,ready,written=[],inflight=0,held=null;
  try{
    firebase.initializeApp(cfg);
    fs=firebase.firestore();
    ready=new Promise(function(res,rej){
      var done=false;
      firebase.auth().onAuthStateChanged(function(u){
        if(done)return;
        if(u&&!u.isAnonymous&&u.emailVerified){done=true;window.__authEmail=String(u.email||'').toLowerCase();hideGate();res(u);return;}
        if(u&&u.isAnonymous){firebase.auth().signOut();return;}
        showGate(u&&!u.emailVerified?'verify':'login',u);
      });
    });
  }catch(e){ready=Promise.reject(e);}

  /* ---------- ekran logowania (e-mail + hasło) ---------- */
  var gate=null,gmode='login';
  function gmsg(t,ok){var m=gate&&gate.querySelector('.gmsg');if(m){m.textContent=t||'';m.className='gmsg'+(ok?' ok':'');}}
  function errPl(e){var c=(e&&e.code)||'';
    if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Nieprawidłowy e-mail lub hasło.';
    if(/email-already-in-use/.test(c))return 'Konto z tym adresem już istnieje – zaloguj się albo użyj „Nie pamiętam hasła”.';
    if(/weak-password/.test(c))return 'Hasło musi mieć co najmniej 6 znaków.';
    if(/invalid-email/.test(c))return 'To nie wygląda na poprawny adres e-mail.';
    if(/too-many-requests/.test(c))return 'Zbyt wiele prób. Odczekaj chwilę i spróbuj ponownie.';
    if(/network/.test(c))return 'Brak połączenia z internetem.';
    if(/operation-not-allowed/.test(c))return 'Logowanie e-mailem nie jest jeszcze włączone w Firebase.';
    return 'Coś poszło nie tak ('+(c||'błąd')+').';}
  function gateHTML(u){
    var h='<div class="gbox"><div class="glogo">RR</div><h1>Dokumenty Rady Rodziców</h1>';
    if(gmode==='verify'){
      h+='<p class="gsub">Na adres <b>'+(u&&u.email||'')+'</b> wysłaliśmy link potwierdzający. Kliknij go w mailu (sprawdź też SPAM), a potem wróć tutaj.</p>'+
        '<button class="gbtn" data-g="checkver">Potwierdziłam/em – wchodzę</button><button class="glink" data-g="resend">Wyślij link ponownie</button><button class="glink" data-g="out">Zaloguj się innym kontem</button>';
    }else{
      var titles={login:'Zaloguj się',signup:'Pierwsze logowanie – załóż konto',reset:'Nie pamiętam hasła'};
      h+='<p class="gsub">'+titles[gmode]+'</p>'+
        '<label>E-mail<input type="email" id="gemail" autocomplete="email" placeholder="adres podany Radzie"></label>'+
        (gmode!=='reset'?'<label>Hasło<input type="password" id="gpass" autocomplete="'+(gmode==='signup'?'new-password':'current-password')+'" placeholder="'+(gmode==='signup'?'min. 6 znaków':'')+'"></label>':'')+
        (gmode==='signup'?'<label>Powtórz hasło<input type="password" id="gpass2" autocomplete="new-password"></label>':'')+
        '<button class="gbtn" data-g="'+gmode+'">'+(gmode==='login'?'Zaloguj się':gmode==='signup'?'Załóż konto':'Wyślij link do zmiany hasła')+'</button>';
      if(gmode==='login')h+='<button class="glink" data-g="m-reset">Nie pamiętam hasła</button><div class="gsep">Logujesz się pierwszy raz?</div><button class="gbtn2" data-g="m-signup">Załóż konto</button>';
      else h+='<button class="glink" data-g="m-login">← Wróć do logowania</button>';
      if(gmode==='signup')h+='<p class="gnote">Użyj adresu e-mail, który administrator wpisał przy Twoim nazwisku w aplikacji.</p>';
    }
    return h+'<p class="gmsg"></p></div>';
  }
  function showGate(mode,u){
    gmode=mode||gmode;
    var mount=function(){
      if(!gate){gate=document.createElement('div');gate.id='authgate';document.body.appendChild(gate);
        gate.addEventListener('click',onGate);
        gate.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'){var b=gate.querySelector('.gbtn');if(b)b.click();}});}
      var keep=gate.querySelector('#gemail');keep=keep?keep.value:'';
      gate.innerHTML=gateHTML(u||firebase.auth().currentUser);
      var em=gate.querySelector('#gemail');if(em){em.value=keep;(keep?gate.querySelector('#gpass')||em:em).focus();}
    };
    if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount);
  }
  function hideGate(){if(gate){gate.remove();gate=null;}}
  function val(id){var x=gate.querySelector('#'+id);return x?x.value.trim():'';}
  function busy(on){var b=gate&&gate.querySelector('.gbtn');if(b){b.disabled=on;}}
  function onGate(e){
    var b=e.target.closest('[data-g]');if(!b)return;var g=b.dataset.g,A=firebase.auth();
    if(g.indexOf('m-')===0){showGate(g.slice(2));return;}
    if(g==='login'){var em=val('gemail').toLowerCase(),pw=gate.querySelector('#gpass').value;if(!em||!pw){gmsg('Wpisz e-mail i hasło.');return;}busy(true);
      A.signInWithEmailAndPassword(em,pw).catch(function(x){busy(false);gmsg(errPl(x));});return;}
    if(g==='signup'){var em2=val('gemail').toLowerCase(),p1=gate.querySelector('#gpass').value,p2=gate.querySelector('#gpass2').value;
      if(!em2||!p1){gmsg('Wpisz e-mail i hasło.');return;}if(p1!==p2){gmsg('Hasła się różnią.');return;}busy(true);
      A.createUserWithEmailAndPassword(em2,p1).then(function(c){A.languageCode='pl';return c.user.sendEmailVerification();}).then(function(){showGate('verify');gmsg('Wysłaliśmy link potwierdzający.',true);}).catch(function(x){busy(false);gmsg(errPl(x));});return;}
    if(g==='reset'){var em3=val('gemail').toLowerCase();if(!em3){gmsg('Wpisz swój e-mail.');return;}busy(true);A.languageCode='pl';
      A.sendPasswordResetEmail(em3).then(function(){busy(false);gmsg('Jeśli konto istnieje, wysłaliśmy link do ustawienia nowego hasła. Sprawdź skrzynkę (i SPAM).',true);}).catch(function(x){busy(false);gmsg(errPl(x));});return;}
    if(g==='checkver'){var u=A.currentUser;if(!u)return;u.reload().then(function(){if(A.currentUser.emailVerified){return A.currentUser.getIdToken(true).then(function(){location.reload();});}gmsg('Adres nie jest jeszcze potwierdzony – kliknij link w mailu.');});return;}
    if(g==='resend'){var u2=A.currentUser;if(!u2)return;A.languageCode='pl';u2.sendEmailVerification().then(function(){gmsg('Wysłano ponownie.',true);}).catch(function(x){gmsg(errPl(x));});return;}
    if(g==='out'){A.signOut().then(function(){showGate('login');});return;}
  }
  window.__fbSignOut=function(){firebase.auth().signOut().then(function(){location.reload();});};

  function warn(e){
    try{console.error('Firebase:',e);
    var b=document.getElementById('fbwarn');
    if(!b){b=document.createElement('div');b.id='fbwarn';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#FADBE6;color:#9B3560;font:700 14px Nunito,sans-serif;padding:8px 14px;text-align:center';document.body.appendChild(b);}
    b.textContent=(e&&e.code==='permission-denied')?'Twoje konto nie ma dostępu do danych. Poproś administratora o dopisanie Twojego adresu e-mail w zakładce Członkowie.':'Brak połączenia z bazą danych – zmiany mogą się nie zapisać. Sprawdź internet i odśwież stronę.';}catch(x){}
  }
  if(ready)ready.catch(warn);
  /* ===== dane rozdzielone: app/pub (wszyscy członkowie), app/priv (tylko Prezydium),
     votes/* (każdy swój głos), notes/* (notatki) ===== */
  var REP='Przedstawiciel klasy';
  var lastAccess='',wasAdmin=false;
  ready.then(function(){return fs.doc('config/access').get();}).then(function(x){var d=x&&x.exists?x.data():null;if(d&&window.__authEmail&&(d.admins||[]).indexOf(window.__authEmail)>=0)wasAdmin=true;}).catch(function(){});
  function low(x){return String(x||'').trim().toLowerCase();}
  function syncAccess(obj){
    try{
      if(!obj||!obj.members||!isPriv)return;
      var ok=function(x){return /@/.test(x);};
      var ems=obj.members.map(function(m){return low(m.email);}).filter(ok);
      var prv=obj.members.filter(function(m){return m.func!==REP;}).map(function(m){return low(m.email);}).filter(ok);
      var adm=obj.members.filter(function(m){return m.id===(obj.settings||{}).adminId;}).map(function(m){return low(m.email);}).filter(ok);
      var me=window.__authEmail;
      if(me&&wasAdmin){if(ems.indexOf(me)<0)ems.push(me);if(prv.indexOf(me)<0)prv.push(me);if(adm.indexOf(me)<0)adm.push(me);}
      if(!adm.length)return;
      ems.sort();prv.sort();var key=JSON.stringify([ems,prv,adm]);if(key===lastAccess)return;
      fs.doc('config/access').set({emails:ems,priv:prv,admins:adm}).then(function(){lastAccess=key;}).catch(function(){});
    }catch(e){}
  }

  var C={pub:null,priv:null,votes:{},notes:{}},isPriv=false,loaded=false;
  var lastCanon=null,listeners=[],inflight2=0,pending=false;
  function J(x){return JSON.parse(JSON.stringify(x==null?null:x));}
  function sortDeep(x){
    if(Array.isArray(x))return x.map(sortDeep);
    if(x&&typeof x==='object'){var o={};Object.keys(x).sort().forEach(function(k){if(x[k]!==undefined&&x[k]!==null)o[k]=sortDeep(x[k]);});return o;}
    return x;
  }
  function canon(d){
    d=J(d)||{};
    (d.resolutions||[]).forEach(function(r){if(!r.poll)delete r.poll;});
    d.notes=(d.notes||[]).map(function(n){delete n.email;return n;}).sort(function(a,b){return String(a.id).localeCompare(String(b.id));});
    ['flags','settings','members','events','ann','docs','meetings','resolutions','reports'].forEach(function(k){if(d[k]==null)d[k]=(k==='flags'||k==='settings')?{}:[];});
    return JSON.stringify(sortDeep(d));
  }
  function META(r){return {body:r.body||'',mode:r.mode||'',cel:r.cel||'',kwota:r.kwota||'',subject:r.subject||'',date:r.date||'',status:r.status||'',num:r.num==null?'':r.num,year:r.year==null?'':r.year};}
  function merge(){
    var pub=C.pub||{},prv=C.priv||{},polls=pub.polls||{};
    var d={v:1,flags:prv.flags||{},settings:J(pub.settings)||{},members:J(pub.members)||[],events:J(pub.events)||[],ann:J(pub.ann)||[],docs:J(pub.docs)||[],duesStats:J(pub.duesStats)||[],
      meetings:J(prv.meetings)||[],resolutions:[],reports:J(prv.reports)||[],notes:[]};
    if(isPriv){
      d.resolutions=(J(prv.resolutions)||[]).map(function(r){var p=polls[r.id];if(p)r.poll={open:!!p.open,votes:{}};return r;});
    }else{
      d.resolutions=Object.keys(polls).map(function(id){var p=polls[id];var r=J(p.meta)||{};r.id=id;r.attachments=[];r.poll={open:!!p.open,votes:{}};return r;});
    }
    Object.keys(C.votes).forEach(function(k){
      var v=C.votes[k];var m=d.members.find(function(x){return x.id===v.member;});
      if(!m||low(m.email)!==low(v.email))return;
      var r=d.resolutions.find(function(x){return x.id===v.res;});
      if(r&&r.poll)r.poll.votes[v.member]=v.v;
    });
    d.notes=Object.keys(C.notes).map(function(k){return J(C.notes[k]);});
    return d;
  }
  function deliver(){
    if(!loaded)return;
    if(inflight2){pending=true;return;}
    var d=merge(),c=canon(d);
    if(c===lastCanon)return;
    lastCanon=c;
    listeners.forEach(function(cb){cb({exists:true,data:function(){return J(d);}});});
  }
  function track(p){inflight2++;return p.then(function(){var b=document.getElementById('fbwarn');if(b)b.remove();}).catch(function(e){warn(e);}).finally(function(){inflight2--;if(!inflight2&&pending){pending=false;deliver();}});}
  function parseDoc(s){if(!s.exists)return null;var raw=s.data();try{return raw&&typeof raw.json==='string'?JSON.parse(raw.json):raw;}catch(e){return null;}}
  function putDoc(path,obj){return fs.doc(path).set({json:JSON.stringify(obj),updated:firebase.firestore.FieldValue.serverTimestamp()});}
  function vkey(res,mem){return String(res)+'~'+String(mem);}

  function splitAndWrite(obj,initial){
    var me=window.__authEmail,ps=[];
    var mm=(obj.members||[]).find(function(m){return low(m.email)===me;});
    if(isPriv){
      var polls={};
      (obj.resolutions||[]).forEach(function(r){if(r.poll)polls[r.id]={open:!!r.poll.open,meta:META(r)};});
      var pub={settings:obj.settings||{},members:obj.members||[],events:obj.events||[],ann:obj.ann||[],docs:obj.docs||[],duesStats:obj.duesStats||[],polls:polls};
      var prv={flags:obj.flags||{},meetings:obj.meetings||[],reports:obj.reports||[],
        resolutions:(obj.resolutions||[]).map(function(r){var c=J(r);delete c.poll;return c;})};
      if(JSON.stringify(pub)!==JSON.stringify(C.pub)){C.pub=J(pub);ps.push(putDoc('app/pub',pub));}
      if(JSON.stringify(prv)!==JSON.stringify(C.priv)){C.priv=J(prv);ps.push(putDoc('app/priv',prv));}
    }
    /* głosy: przy migracji wszystkie (robi to administrator), na co dzień tylko własny */
    (obj.resolutions||[]).forEach(function(r){
      var vs=(r.poll&&r.poll.votes)||{};
      Object.keys(vs).forEach(function(mid){
        if(!initial&&(!mm||mid!==mm.id))return;
        var m=(obj.members||[]).find(function(x){return x.id===mid;});if(!m||!low(m.email)&&!initial)return;
        var k=vkey(r.id,mid),cur=C.votes[k];
        if(cur&&cur.v===vs[mid])return;
        var doc={res:r.id,member:mid,v:vs[mid],email:initial?low(m.email):me};
        if(!doc.email)return;
        C.votes[k]=doc;ps.push(fs.collection('votes').doc(k).set(doc));
      });
    });
    /* notatki */
    var ids={};
    (obj.notes||[]).forEach(function(n){
      ids[n.id]=1;var cur=C.notes[n.id];var nn=J(n);nn.email=(cur&&cur.email)||me;
      if(!cur){C.notes[n.id]=nn;ps.push(fs.collection('notes').doc(n.id).set(nn));}
      else if(isPriv&&JSON.stringify(nn)!==JSON.stringify(cur)){C.notes[n.id]=nn;ps.push(fs.collection('notes').doc(n.id).set(nn));}
    });
    if(isPriv)Object.keys(C.notes).forEach(function(id){if(!ids[id]){delete C.notes[id];ps.push(fs.collection('notes').doc(id).delete());}});
    return Promise.all(ps);
  }

  var loading=null;
  function loadAll(){
    if(loading)return loading;
    loading=ready.then(function(){
      return fs.doc('app/priv').get().then(function(s){isPriv=true;C.priv=parseDoc(s);},function(){isPriv=false;});
    }).then(function(){
      return fs.doc('app/pub').get().then(function(s){C.pub=parseDoc(s);});
    }).then(function(){
      if(C.pub||!isPriv)return;
      /* jednorazowe przeniesienie ze starego zapisu app/data */
      return fs.doc('app/data').get().then(function(s){var old=parseDoc(s);if(!old)return;inflight2++;return splitAndWrite(old,true).finally(function(){inflight2--;});}).catch(function(e){console.warn('migracja',e);});
    }).then(function(){
      return Promise.all([
        fs.collection('votes').get().then(function(q){q.forEach(function(x){C.votes[x.id]=x.data();});}),
        fs.collection('notes').get().then(function(q){q.forEach(function(x){C.notes[x.id]=x.data();});})
      ]);
    }).then(function(){
      loaded=true;
      var subs=function(path,key){fs.doc(path).onSnapshot(function(s){if(s.metadata.hasPendingWrites)return;C[key]=parseDoc(s);deliver();},warn);};
      subs('app/pub','pub');if(isPriv)subs('app/priv','priv');
      ['votes','notes'].forEach(function(col){fs.collection(col).onSnapshot(function(q){if(q.metadata.hasPendingWrites)return;var o={};q.forEach(function(x){o[x.id]=x.data();});C[col]=o;deliver();},warn);});
    }).catch(function(e){warn(e);throw e;});
    return loading;
  }
  window.__isPriv=function(){return isPriv;};

  var dbApi={
    doc:function(){
      return {
        get:function(){return loadAll().then(function(){var d=merge();lastCanon=canon(d);var empty=!C.pub&&!C.priv;return {exists:!empty,data:function(){return J(d);}};});},
        set:function(obj){syncAccess(obj);lastCanon=canon(obj);return track(splitAndWrite(obj,false));},
        onSnapshot:function(cb){listeners.push(cb);return function(){};}
      };
    }
  };

  /* pobieranie plików (Word, kopia zapasowa) */
  var downloadsApi={save:function(o){
    var blob=o.data instanceof Blob?o.data:new Blob([o.data]);
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=o.filename||'plik';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},4000);
    return Promise.resolve();
  }};

  /* załączniki: zapis w Firestore w kawałkach (bez płatnego Storage) */
  var CH=700000,cache={};
  function readAsDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(b);});}
  function shrinkImage(f){
    return new Promise(function(res){
      var img=new Image(),u=URL.createObjectURL(f);
      img.onload=function(){
        var max=1800,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
        c.toBlob(function(b){res(b||f);},'image/jpeg',0.82);
      };
      img.onerror=function(){URL.revokeObjectURL(u);res(f);};
      img.src=u;
    });
  }
  var assetsApi={
    upload:function(f){
      var id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      var isImg=/^image\//.test(f.type);
      return (isImg?shrinkImage(f):Promise.resolve(f)).then(function(b){
        if(b.size>8*1024*1024){var e=new Error('too big');e.code='plik za duży (max 8 MB)';throw e;}
        return readAsDataURL(b).then(function(du){
          var parts=[];for(var i=0;i<du.length;i+=CH)parts.push(du.slice(i,i+CH));
          var ps=parts.map(function(p,i){return fs.collection('files').doc(id+'_'+i).set({d:p});});
          ps.push(fs.collection('files').doc(id).set({n:parts.length,type:b.type||f.type,name:f.name}));
          return Promise.all(ps).then(function(){
            cache[id]=URL.createObjectURL(b);
            return {id:id,url:'fs:'+id,contentType:b.type||f.type,sizeBytes:b.size};
          });
        });
      });
    },
    delete:function(id){
      return fs.collection('files').doc(id).get().then(function(s){
        var n=s.exists?(s.data().n||0):0,ps=[fs.collection('files').doc(id).delete()];
        for(var i=0;i<n;i++)ps.push(fs.collection('files').doc(id+'_'+i).delete());
        return Promise.all(ps);
      });
    }
  };
  function loadFile(id){
    if(cache[id])return Promise.resolve(cache[id]);
    return fs.collection('files').doc(id).get().then(function(s){
      if(!s.exists)throw new Error('brak');
      var n=s.data().n,ps=[];for(var i=0;i<n;i++)ps.push(fs.collection('files').doc(id+'_'+i).get());
      return Promise.all(ps).then(function(arr){
        var du=arr.map(function(x){return x.data().d;}).join('');
        return fetch(du).then(function(r){return r.blob();}).then(function(b){cache[id]=URL.createObjectURL(b);return cache[id];});
      });
    });
  }
  function fixLinks(root){
    (root||document).querySelectorAll('img[src^="fs:"],a[href^="fs:"]').forEach(function(el){
      var attr=el.tagName==='IMG'?'src':'href',id=el.getAttribute(attr).slice(3);
      if(el.dataset.fsLoading===id)return;el.dataset.fsLoading=id;
      ready.then(function(){return loadFile(id);}).then(function(u){el.setAttribute(attr,u);}).catch(function(){});
    });
  }
  document.addEventListener('DOMContentLoaded',function(){
    fixLinks();
    new MutationObserver(function(){fixLinks();}).observe(document.body,{childList:true,subtree:true});
  });

  window.claude={use:function(name){
    if(name==='downloads')return Promise.resolve(downloadsApi);
    if(name==='user')return Promise.resolve({can:function(){return Promise.resolve(true);}});
    if(name==='db')return ready.then(function(){return dbApi;});
    if(name==='assets')return ready.then(function(){return assetsApi;});
    return Promise.reject(new Error('unknown'));
  }};
})();
</script>

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
const fmtDate=iso=>{if(!iso)return BL(10);const p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0];};
const fmtShort=iso=>{if(!iso)return BL(10);const p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0].slice(2);};
function fmtWhen(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+', '+pad(d.getHours())+':'+pad(d.getMinutes());}
const syStart=iso=>{const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=7?y:y-1;};
const syLabel=s=>s+'/'+(s+1);
const syFromLabel=l=>parseInt(String(l||'').slice(0,4),10)||syStart(todayISO());
const inSY=(iso,s)=>!!iso&&iso>=s+'-07-01'&&iso<=(s+1)+'-06-30';
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const num=x=>{if(typeof x==='number')return isFinite(x)?x:0;const n=parseFloat(String(x||'').replace(/[\s\u00A0]/g,'').replace(',','.'));return isFinite(n)?n:0;};
const blank=x=>x===''||x==null;
const BL=n=>' '.repeat(n||3);
const rno=r=>(blank(r.num)?BL(3):r.num)+'/'+(blank(r.year)?BL(3):r.year);
function money(n){n=Math.round(n*100)/100;const neg=n<0;n=Math.abs(n);const p=n.toFixed(2).split('.');const i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0');return (neg?'−':'')+(p[1]==='00'?i:i+','+p[1]);}
function money2(n){n=Math.round(n*100)/100;const neg=n<0;n=Math.abs(n);const p=n.toFixed(2).split('.');return (neg?'−':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')+','+p[1];}
const asciiName=s=>String(s).replace(/ł/g,'l').replace(/Ł/g,'L').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'');

/* ---------- ludzie i podpisy ---------- */
function findMember(name){const n=String(name||'').trim().toLowerCase();return n?db.members.find(x=>x.name.trim().toLowerCase()===n):null;}
function hon(name){const m=findMember(name);return m?((m.g==='m'?'Pan ':'Pani ')+m.name):name;}
function gsuf(name){const m=findMember(name);return m?(m.g==='m'?'':'a'):'(a)';}
function sigOf(role){
  const pick=role==='chair'?(x=>/^Przewodnicząc/.test(x.func)):role==='sec'?(x=>x.func==='Sekretarz'):(x=>x.func==='Skarbnik');
  const m=db.members.find(pick);
  const label=role==='chair'?((m?m.func:'Przewodniczący/a')+' Rady Rodziców'):role==='sec'?'Sekretarz Rady Rodziców':'Skarbnik Rady Rodziców';
  return {label:label,name:m?m.name:BL(22)};
}

/* ---------- uchwały ---------- */
function voteWho(r){return r.body==='rada'?{who:'Członkowie Rady Rodziców',full:'Rady Rodziców'}:{who:'Członkowie Prezydium RR',full:'Prezydium Rady Rodziców'};}
function votes(r){
  if(r.manual)return {n:BL(5),za:BL(4),pr:BL(4),ws:BL(4),dots:true};
  const z=blank(r.za)?null:num(r.za),p=blank(r.przeciw)?null:num(r.przeciw),w=blank(r.wstrz)?null:num(r.wstrz);
  const any=z!==null||p!==null||w!==null;
  const f=v=>v===null?BL(4):String(v);
  return {n:any?String((z||0)+(p||0)+(w||0)):BL(5),za:f(z),pr:f(p),ws:f(w),dots:!any,z:z,p:p,w:w};
}
function voteInfo(r){
  if(r.manual)return {cls:'wait',text:'Głosy do wpisania ręcznie po wydruku'};
  const v=votes(r);
  if(v.z===null||v.p===null||v.w===null)return {cls:'wait',text:'Uzupełnij wszystkie trzy wartości (wpisz 0, jeśli brak głosów)'};
  const n=v.z+v.p+v.w,el=num(r.elig);
  if(el&&n>el)return {cls:'no',text:'Uwaga: głosów ('+n+') jest więcej niż uprawnionych ('+el+')'};
  return v.z>v.p?{cls:'ok',text:'Więcej głosów za niż przeciw'}:{cls:'no',text:'Głosów za nie jest więcej niż przeciw'};
}
function pollTally(r){
  const votes=(r.poll&&r.poll.votes)||{};let za=0,przeciw=0,wstrz=0;
  Object.values(votes).forEach(v=>{if(v==='za')za++;else if(v==='przeciw')przeciw++;else if(v==='wstrz')wstrz++;});
  return {za:za,przeciw:przeciw,wstrz:wstrz,total:za+przeciw+wstrz};
}
function subjectOf(r){let s=(r.subject||'').trim();if(!s)return '';s=s.replace(/^w sprawie\s*/i,'');return 'w sprawie '+s;}
function nextNum(year,excludeId){let mx=0;db.resolutions.forEach(x=>{if(x.year===year&&x.id!==excludeId&&num(x.num)>mx)mx=num(x.num);});return mx+1;}
function decideResolution(r){
  const z=blank(r.za)?0:num(r.za),p=blank(r.przeciw)?0:num(r.przeciw);
  if(z>p){
    r.status='przyjeta';
    if(blank(r.num))r.num=nextNum(r.year,r.id);
  }else{
    r.status='odrzucona';r.num='';r.numT=false;
  }
  return r.status;
}
function textBlocks(t){
  const out=[];let cur=null;
  String(t||'').split('\n').forEach(line=>{
    const s=line.trim();
    if(!s){cur=null;return;}
    if(/^[-–•]\s+/.test(s)){if(!cur){cur={k:'list',style:'dash',items:[]};out.push(cur);}cur.items.push(s.replace(/^[-–•]\s+/,''));}
    else{cur=null;out.push({k:'p',text:s});}
  });
  return out;
}
function resBlocks(r,noHeader){
  const w=voteWho(r),B=[],st=r.status||'przyjeta';
  if(!noHeader)B.push({k:'header',text:db.settings.school});
  const titleLead=st==='przyjeta'?'UCHWAŁA '+rno(r):st==='odrzucona'?'WNIOSEK (ODRZUCONY)':'WNIOSEK';
  B.push({k:'title',text:titleLead+' z dnia '+fmtDate(r.date)});
  const sj=subjectOf(r);
  if(sj)B.push({k:'subject',text:sj});
  if(r.mode==='wydatek'){
    B.push({k:'p',text:w.who+' w dniu '+fmtShort(r.date)+' głosowali w sprawie wydatku poza preliminarzem kwoty '+(blank(r.kwota)?BL(11)+' zł':money(num(r.kwota))+' zł')+' - na opłacenie kosztów '+((r.cel||'').trim()||BL(15))+'.'});
  }else{
    const tb=textBlocks(r.text);
    if(tb.length)tb.forEach(x=>B.push(x));else B.push({k:'p',text:BL(30)});
  }
  const v=votes(r);
  B.push({k:'p',text:'W głosowaniu udział wzięło '+v.n+' z '+(blank(r.elig)?BL(3):r.elig)+' uprawnionych do głosowania członków '+w.full+' w tym głosów:'});
  B.push({k:'list',style:'dash',items:['za '+v.za,'przeciw '+v.pr,'wstrzymało się '+v.ws]});
  if((r.wejscie||'').trim())B.push({k:'p',text:r.wejscie.trim()});
  const c=sigOf('chair'),s=sigOf('sec');
  B.push({k:'sig',label:c.label,name:c.name});
  B.push({k:'sig',label:s.label,name:s.name});
  return B;
}
function resLine(r){
  const v=votes(r),st=r.status||'przyjeta';
  const lead=st==='przyjeta'?'Uchwała nr '+rno(r):st==='odrzucona'?'Wniosek (odrzucony)':'Wniosek';
  return lead+' '+(subjectOf(r)||'')+(v.dots?'':' (za '+v.za+', przeciw '+v.pr+', wstrzymało się '+v.ws+')')+'.';
}
function bundleBlocks(list){
  const B=[];
  list.forEach((r,i)=>{if(i)B.push({k:'pagebreak'});resBlocks(r).forEach(x=>B.push(x));});
  return B;
}

/* ---------- zebrania ---------- */
function mtype(m){
  if(m.type==='prezydium')return {gen:'posiedzenia Prezydium Rady Rodziców',nom:'posiedzenie Prezydium Rady Rodziców',noun:'Posiedzenie'};
  if(m.type==='dyrekcja')return {gen:'spotkania z Dyrekcją szkoły',nom:'spotkanie z Dyrekcją szkoły',noun:'Spotkanie'};
  if(m.type==='inne')return {gen:'spotkania',nom:'spotkanie',noun:'Spotkanie'};
  return {gen:'zebrania Rady Rodziców',nom:'zebranie Rady Rodziców',noun:'Zebranie'};
}
function attendees(m){const l=[...db.members].sort(byFunc);return m.type==='rada'?l:l.filter(x=>PRES.includes(x.func));}
function attStats(m){const a=attendees(m),at=m.att||{};const f=k=>a.filter(x=>at[x.id]===k);return {all:a,p:f('p'),n:f('n'),u:f('u')};}
const names=a=>a.map(x=>x.name).join(', ');
function attCounts(m){
  if(m.attMode==='count'){return {count:true,p:blank(m.cntP)?null:num(m.cntP),total:blank(m.cntTotal)?null:num(m.cntTotal)};}
  const S=attStats(m);return {count:false,p:S.p.length,total:S.all.length};
}
function attSentence(m){
  const C=attCounts(m);
  if(C.p===null)return '';
  return C.total?' W spotkaniu wzięło udział '+C.p+' z '+C.total+' członków.':(C.count?' Liczba osób obecnych: '+C.p+'.':'');
}
function protocolBlocks(m){
  const t=mtype(m),S=attStats(m),B=[];
  B.push({k:'header',text:db.settings.school});
  B.push({k:'title',text:'Protokół z '+t.gen});
  B.push({k:'title',text:'z dnia '+fmtDate(m.date),size:26});
  const first=[];
  let intro='W dniu '+fmtDate(m.date)+(m.time?' o godz. '+m.time:'')+' odbyło się '+t.nom+(m.type==='inne'&&m.customType?' ('+m.customType+')':'')+(m.place?', miejsce: '+m.place:'')+'.';
  intro+=attSentence(m);
  first.push(intro);
  if((m.guests||'').trim())first.push('Obecni goście: '+m.guests.trim()+'.');
  const ag=(m.agenda||[]).filter(x=>x.trim());
  if((m.chair||'').trim()){
    const g=gsuf(m.chair);
    first.push(t.noun+' otworzył'+g+' '+hon(m.chair.trim())+(ag.length?' i przedstawił'+g+' porządek obrad:':'.'));
  }else if(ag.length)first.push('Przedstawiono porządek obrad:');
  B.push({k:'list',style:'dot',items:first});
  if(ag.length)B.push({k:'list',style:'num',items:ag});
  const org=[];
  if((m.protok||'').trim())org.push('Protokolant: '+m.protok.trim()+'.');
  if((m.scrut||'').trim())org.push('Komisja skrutacyjna: '+m.scrut.trim()+'.');
  if(org.length)B.push({k:'list',style:'dot',items:org});
  const notes=(m.notes||[]).filter(x=>x.trim());
  if(notes.length){B.push({k:'h2',text:'Przebieg obrad'});B.push({k:'list',style:'dot',items:notes.map(x=>x.trim())});}
  const rs=(m.resIds||[]).map(id=>db.resolutions.find(x=>x.id===id)).filter(Boolean);
  if(rs.length){B.push({k:'h2',text:'Podjęte uchwały'});B.push({k:'list',style:'dot',items:rs.map(resLine)});}
  const qs=(m.questions||[]).filter(x=>x.trim());
  if(qs.length){B.push({k:'h2',text:'Wolne wnioski i pytania'});B.push({k:'list',style:'dot',items:qs.map(x=>x.trim())});}
  B.push({k:'p',align:'left',before:200,text:'Na tym '+t.noun.toLowerCase()+' zakończono'+(m.timeEnd?' o godz. '+m.timeEnd:'')+'.'});
  const ch=findMember(m.chair);
  B.push({k:'sig2',
    left:{label:'Protokolant',name:(m.protok||'').trim()||BL(22)},
    right:{label:ch?ch.func+' Rady Rodziców':'Przewodniczący obrad',name:(m.chair||'').trim()||BL(22)}});
  return B;
}
function attBlocks(m){
  const t=mtype(m),S=attStats(m);
  const B=[{k:'header',text:db.settings.school},{k:'title',text:'Lista obecności'},{k:'title',size:26,text:cap(t.nom)+' z dnia '+fmtDate(m.date)}];
  if(m.place||m.time)B.push({k:'p',align:'center',text:[m.place,m.time?'godz. '+m.time:''].filter(Boolean).join(', ')});
  const rows=S.all.map((x,i)=>[String(i+1),x.name,[x.func,x.cls].filter(Boolean).join(', '),'']);
  for(let i=0;i<4;i++)rows.push([String(S.all.length+i+1),'','','']);
  B.push({k:'table',widths:[7,33,25,35],head:['Lp.','Imię i nazwisko','Funkcja / klasa','Podpis'],rows:rows,aligns:['center','left','left','left'],rowH:560});
  return B;
}
function meetingSummary(m){
  const t=mtype(m),S=attStats(m),L=[];
  L.push('W dniu '+fmtDate(m.date)+' odbyło się '+t.nom+'.'+attSentence(m));
  const ag=(m.agenda||[]).filter(x=>x.trim());
  if(ag.length){L.push('Porządek obrad:');ag.forEach(a=>L.push('- '+a.trim()));}
  const nt=(m.notes||[]).filter(x=>x.trim());
  if(nt.length){L.push('Przebieg obrad:');nt.forEach(a=>L.push('- '+a.trim().replace(/\n+/g,' ')));}
  const rs=(m.resIds||[]).map(id=>db.resolutions.find(x=>x.id===id)).filter(Boolean);
  if(rs.length){L.push('Podjęte uchwały:');rs.forEach(r=>L.push('- '+resLine(r)));}
  const qs=(m.questions||[]).filter(x=>x.trim());
  if(qs.length){L.push('Wolne wnioski i pytania:');qs.forEach(a=>L.push('- '+a.trim().replace(/\n+/g,' ')));}
  return L.join('\n');
}

/* ---------- sprawozdania ---------- */
const sumRows=a=>(a||[]).reduce((s,x)=>s+num(x.a),0);
function finTotals(r){const o=num(r.open),i=sumRows(r.inc),e=sumRows(r.exp);return {open:o,inc:i,exp:e,end:o+i-e};}
function reportBlocks(r){
  const B=[{k:'header',text:db.settings.school}];
  if(r.type==='dzialalnosc'){
    B.push({k:'title',text:'Sprawozdanie z działalności'});
    B.push({k:'title',size:26,text:'Rady Rodziców za rok szkolny '+r.sy});
  }else if(r.type==='finansowe'){
    B.push({k:'title',text:'Sprawozdanie finansowe'});
    B.push({k:'title',size:26,text:'z funduszu Rady Rodziców za rok szkolny '+r.sy});
  }else{
    const m=db.meetings.find(x=>x.id===r.meetingId);
    B.push({k:'title',text:'Sprawozdanie z zebrania'});
    B.push({k:'title',size:26,text:'z dnia '+fmtDate(m?m.date:r.date)});
  }
  B.push({k:'p',align:'right',text:'Data sporządzenia: '+fmtDate(r.date)});
  if(r.type==='dzialalnosc'){
    (r.sections||[]).forEach(s=>{
      if(!(s.h||'').trim()&&!(s.t||'').trim())return;
      if((s.h||'').trim())B.push({k:'h2',text:s.h.trim()});
      textBlocks(s.t).forEach(x=>B.push(x));
    });
  }else if(r.type==='finansowe'){
    const T=finTotals(r);
    const mk=(arr,total,label)=>{
      const rows=(arr||[]).filter(x=>(x.d||'').trim()||!blank(x.a)).map((x,i)=>[String(i+1),(x.d||'').trim(),money2(num(x.a))]);
      if(!rows.length)rows.push(['—','brak pozycji','0,00']);
      rows.push(['',label,money2(total)]);
      return {k:'table',widths:[8,62,30],head:['Lp.','Tytuł','Kwota (zł)'],rows:rows,aligns:['center','left','right'],boldLast:true};
    };
    B.push({k:'h2',text:'Wpływy'});B.push(mk(r.inc,T.inc,'Razem wpływy'));
    B.push({k:'h2',text:'Wydatki'});B.push(mk(r.exp,T.exp,'Razem wydatki'));
    B.push({k:'h2',text:'Podsumowanie'});
    B.push({k:'table',widths:[70,30],head:['Pozycja','Kwota (zł)'],rows:[['Saldo początkowe',money2(T.open)],['Wpływy razem',money2(T.inc)],['Wydatki razem',money2(T.exp)],['Saldo końcowe',money2(T.end)]],aligns:['left','right'],boldLast:true});
    if((r.notes||'').trim()){B.push({k:'h2',text:'Uwagi'});textBlocks(r.notes).forEach(x=>B.push(x));}
  }else{
    const tb=textBlocks(r.text);
    if(tb.length)tb.forEach(x=>B.push(x));else B.push({k:'p',text:BL(30)});
  }
  const ch=sigOf('chair');
  const other=r.type==='finansowe'?(db.members.some(x=>x.func==='Skarbnik')?sigOf('tre'):sigOf('sec')):sigOf('sec');
  B.push({k:'sig2',left:other,right:ch});
  return B;
}
function docBlocks(d){
  const B=[{k:'header',text:db.settings.school}];
  B.push({k:'title',text:d.title||'Dokument'});
  const tb=textBlocks(d.text);
  if(tb.length)tb.forEach(x=>B.push(x));else B.push({k:'p',text:BL(30)});
  return B;
}

/* ---------- podgląd HTML ---------- */
function toHtml(model){
  let h='';
  const br=t=>esc(t).replace(/\n/g,'<br>');
  model.forEach(b=>{
    switch(b.k){
      case 'header':h+=(db.settings.logo?'<div class="sh-logo"><img src="'+LOGO+'" alt=""></div>':'')+'<div class="sh-school">'+esc(b.text)+'</div>';break;
      case 'title':h+='<div class="sh-title" style="font-size:'+Math.round((b.size||32)*0.62)+'px">'+esc(b.text)+'</div>';break;
      case 'subject':h+='<p class="sh-subject">'+br(b.text)+'</p>';break;
      case 'p':h+='<p class="sh-p" style="text-align:'+(b.align==='both'||!b.align?'justify':b.align)+(b.before?';margin-top:'+Math.round(b.before/12)+'px':'')+'">'+br(b.text)+'</p>';break;
      case 'h2':h+='<div class="sh-h2">'+esc(b.text)+'</div>';break;
      case 'list':{const tag=b.style==='num'?'ol':'ul';h+='<'+tag+' class="sh-list '+(b.style==='dash'?'dash':'')+'">'+b.items.map(i=>'<li>'+br(i)+'</li>').join('')+'</'+tag+'>';break;}
      case 'sig':h+='<div class="sh-sig" style="text-align:right"><div>'+esc(b.label)+'</div><div class="n">'+esc(b.name)+'</div></div>';break;
      case 'sig2':h+='<div class="sh-sig2">'+[b.left,b.right].map(s=>'<div><div class="dl">……………………………</div><div>'+esc(s.name)+'</div><div class="lb">'+esc(s.label)+'</div></div>').join('')+'</div>';break;
      case 'table':h+='<table class="sh-table"><thead><tr>'+b.head.map((c,i)=>'<th style="text-align:'+((b.aligns||[])[i]||'left')+';width:'+b.widths[i]+'%">'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map((r,ri)=>'<tr style="'+(b.boldLast&&ri===b.rows.length-1?'font-weight:700;':'')+(b.rowH?'height:'+Math.round(b.rowH/20*1.2)+'px':'')+'">'+r.map((c,i)=>'<td style="text-align:'+((b.aligns||[])[i]||'left')+'">'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';break;
      case 'spacer':h+='<div class="sh-sp"></div>';break;
      case 'pagebreak':h+='<hr class="sh-pb">';break;
    }
  });
  return h;
}

function b64bytes(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function toDocx(model,title){
  const D=docx,FONT='Times New Roman',SANS='Calibri',TOTAL=9215;
  const AL={left:D.AlignmentType.LEFT,center:D.AlignmentType.CENTER,right:D.AlignmentType.RIGHT,both:D.AlignmentType.JUSTIFIED};
  const kids=[];let pb=false,inst=0;
  const P=o=>{if(pb){o.pageBreakBefore=true;pb=false;}return new D.Paragraph(o);};
  const run=(t,o)=>{o=o||{};return new D.TextRun({text:t,font:o.font||FONT,size:o.size||24,bold:!!o.b});};
  const runs=(t,o)=>String(t).split('\n').flatMap((ln,i)=>i?[new D.TextRun({break:1}),run(ln,o)]:[run(ln,o)]);
  model.forEach(b=>{
    switch(b.k){
      case 'header':
        if(db.settings.logo)kids.push(P({alignment:AL.center,spacing:{after:60},children:[new D.ImageRun({type:'png',data:b64bytes(LOGO.split(',')[1]),transformation:{width:57,height:78}})]}));
        kids.push(P({alignment:AL.center,spacing:{after:200},children:[run(b.text,{font:SANS,size:20})]}));break;
      case 'title':kids.push(P({alignment:AL.center,spacing:{before:120,after:120},children:[run(b.text,{font:SANS,size:b.size||32,b:true})]}));break;
      case 'subject':kids.push(P({alignment:AL.both,indent:{left:567},spacing:{before:240,after:240,line:300},children:runs(b.text,{b:true})}));break;
      case 'p':kids.push(P({alignment:AL[b.align||'both'],spacing:{before:b.before||0,after:160,line:276},children:runs(b.text)}));break;
      case 'h2':kids.push(P({spacing:{before:260,after:120},keepNext:true,children:[run(b.text,{b:true})]}));break;
      case 'list':{
        const ref=b.style==='num'?'num':b.style==='dot'?'dot':'dash';const ins=b.style==='num'?++inst:0;
        b.items.forEach(it=>kids.push(P({alignment:/\n/.test(it)?AL.left:AL.both,numbering:b.style==='num'?{reference:ref,level:0,instance:ins}:{reference:ref,level:0},spacing:{after:80,line:276},children:runs(it)})));
        kids.push(new D.Paragraph({spacing:{after:80},children:[]}));break;}
      case 'sig':
        kids.push(P({alignment:AL.right,spacing:{before:480,after:40},keepNext:true,children:[run(b.label)]}));
        kids.push(P({alignment:AL.right,spacing:{after:200},children:[run(b.name)]}));break;
      case 'sig2':{
        const nb={style:D.BorderStyle.NONE,size:0,color:'FFFFFF'},nob={top:nb,bottom:nb,left:nb,right:nb};
        const cell=s=>new D.TableCell({width:{size:TOTAL/2,type:D.WidthType.DXA},borders:nob,children:[
          new D.Paragraph({alignment:AL.center,spacing:{before:720},children:[run('……………………………………')]}),
          new D.Paragraph({alignment:AL.center,children:[run(s.name)]}),
          new D.Paragraph({alignment:AL.center,children:[run(s.label,{size:20})]})]});
        kids.push(new D.Table({width:{size:TOTAL,type:D.WidthType.DXA},columnWidths:[TOTAL/2,TOTAL/2],borders:{top:nb,bottom:nb,left:nb,right:nb,insideHorizontal:nb,insideVertical:nb},rows:[new D.TableRow({cantSplit:true,children:[cell(b.left),cell(b.right)]})]}));
        break;}
      case 'table':{
        const w=b.widths.map(p=>Math.round(TOTAL*p/100));
        const bd={style:D.BorderStyle.SINGLE,size:4,color:'A6A6A6'},bds={top:bd,bottom:bd,left:bd,right:bd};
        const mk=(cells,head,bold)=>{
          const o={cantSplit:true,tableHeader:!!head,children:cells.map((c,i)=>new D.TableCell({width:{size:w[i],type:D.WidthType.DXA},borders:bds,margins:{top:60,bottom:60,left:100,right:100},verticalAlign:D.VerticalAlign.CENTER,shading:head?{type:D.ShadingType.CLEAR,fill:'EDEDED',color:'auto'}:undefined,children:[new D.Paragraph({alignment:AL[(b.aligns||[])[i]||'left'],children:[run(c,{size:22,b:head||bold})]})]}))};
          if(b.rowH&&!head)o.height={value:b.rowH,rule:D.HeightRule.ATLEAST};
          return new D.TableRow(o);
        };
        const rows=[mk(b.head,true,false)].concat(b.rows.map((r,ri)=>mk(r,false,!!b.boldLast&&ri===b.rows.length-1)));
        kids.push(new D.Table({width:{size:TOTAL,type:D.WidthType.DXA},columnWidths:w,rows:rows}));
        kids.push(new D.Paragraph({spacing:{after:120},children:[]}));break;}
      case 'spacer':kids.push(new D.Paragraph({spacing:{after:b.h||120},children:[]}));break;
      case 'pagebreak':pb=true;break;
    }
  });
  const lvl=(fmt,text,left)=>[{level:0,format:fmt,text:text,alignment:D.AlignmentType.LEFT,style:{paragraph:{indent:{left:left,hanging:360}}}}];
  return new D.Document({
    creator:'Rada Rodziców',title:title||'Dokument',
    styles:{default:{document:{run:{font:FONT,size:24}}}},
    numbering:{config:[
      {reference:'dash',levels:lvl(D.LevelFormat.BULLET,'-',1080)},
      {reference:'dot',levels:lvl(D.LevelFormat.BULLET,'•',720)},
      {reference:'num',levels:lvl(D.LevelFormat.DECIMAL,'%1.',720)}]},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:851,bottom:1135,left:1417,right:1274}}},children:kids}]
  });
}

function parseBulk(text){
  const out=[];
  String(text||'').split('\n').forEach(line=>{
    const s=line.replace(/^\s*\[?\d{1,2}\.\d{2},\s*\d{1,2}:\d{2}\]\s*[^:]{1,60}:\s*/,'').trim();
    if(!s)return;
    const m=s.match(/^(.*?)\s+((?:\d{1,3}(?:[ \u00A0]\d{3})+|\d+)(?:[.,]\d{1,2})?)\s*(?:tys\.?|zł|zl|pln)?\s*$/i);
    const clean=x=>x.replace(/^razem\s+/i,'').trim();
    if(m)out.push({desc:clean(m[1]),kwota:m[2].replace(/[ \u00A0]/g,'').replace('.',',')});

function mailCfg(){const m=(db.settings&&db.settings.mail)||{};return (m.service&&m.template&&m.key)?m:null;}
function appLink(){return location.origin+location.pathname;}
async function sendMail(list,subject,message){
  const cfg=mailCfg();
  if(!cfg){return {ok:false,why:'nocfg'};}
  if(!window.emailjs){return {ok:false,why:'nolib'};}
  const me=curMember();
  const addrs=[...new Set((list||[]).map(x=>String(x).trim()).filter(Boolean))];
  if(!addrs.length)return {ok:false,why:'nolist'};
  let sent=0,lastErr=null;
  for(const addr of addrs){
    try{
      await emailjs.send(cfg.service,cfg.template,{to_email:addr,subject:subject,message:message,link:appLink(),from_name:'Rada Rodziców – '+(me?me.name:'')},{publicKey:cfg.key});
      sent++;
    }catch(e){console.error('EmailJS',e);lastErr=(e&&(e.text||e.status))||'błąd';}
    await new Promise(res=>setTimeout(res,400)); // odstęp między wysyłkami, by uniknąć limitu EmailJS
  }
  if(sent===addrs.length)return {ok:true,sent:sent};
  if(sent>0)return {ok:true,sent:sent,partial:true,why:lastErr};
  return {ok:false,why:lastErr||'błąd'};
}
function voteMailText(r,reminder){

}
async function notifyVote(r,reminder){

  const tx=voteMailText(r,reminder);

function voteTitle(r){return (r.mode==='wydatek'&&!blank(r.cel)?cap(r.cel.trim()):cap((r.subject||'').replace(/^w sprawie\s*/i,''))||'Wniosek bez tytułu')+(r.mode==='wydatek'&&!blank(r.kwota)?' – '+money(num(r.kwota))+' zł':'');}
function voteItem(r){
  const me=curMember(),t=pollTally(r),my=me?(r.poll.votes||{})[me.id]:null,eligible=canVote(me,r);
  const voters=db.members.filter(m=>canVote(m,r)),missing=voters.filter(m=>!(r.poll.votes||{})[m.id]);
  let h='<div class="card"><div class="nhead"><b class="nauthor">'+esc(voteTitle(r))+'</b><span class="nwhen">'+fmtDate(r.date)+'</span></div>';
  h+='<span class="nref">'+(r.body==='rada'?'Głosuje Rada Rodziców':'Głosuje Prezydium')+'</span>';
  if(!blank(r.subject)&&r.mode==='wydatek')h+='<p class="hint" style="margin:0 0 8px">'+esc(subjectOf(r))+'</p>';
  if(eligible){
    h+=my?'<p class="vdone" style="margin:0 0 8px">✓ Twój głos: '+(my==='za'?'za':my==='przeciw'?'przeciw':'wstrzymuję się')+' (możesz go zmienić do końca głosowania)</p>':'<p class="vwarn" style="margin:0 0 8px"><i>!</i>Nie oddano jeszcze Twojego głosu</p>';
    h+='<div class="moreacts">'+[['za','Za'],['przeciw','Przeciw'],['wstrz','Wstrzymuję się']].map(o=>'<button class="btn'+(my===o[0]?' primary':'')+'" data-act="votecast" data-id="'+r.id+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>';
  }else h+='<p class="hint">Nie bierzesz udziału w tym głosowaniu.</p>';
  h+='<p class="hint" style="margin:10px 0 0">Oddane głosy: '+t.total+(r.body!=='rada'&&voters.length?' z '+voters.length:'')+' – za '+t.za+', przeciw '+t.przeciw+', wstrzymało się '+t.wstrz+'.'+(missing.length&&r.body!=='rada'?' Brakuje głosu: '+missing.map(m=>esc(m.name)).join(', ')+'.':'')+'</p>';
  if(canPlan()&&mailCfg()&&missing.length)h+='<p style="margin:10px 0 0"><button class="btn small" data-act="pollremind" data-id="'+r.id+'">Wyślij przypomnienie e-mail do niegłosujących</button></p>';
  if(!isRep(me))h+='<p style="margin:10px 0 0"><button class="btn small" data-act="open" data-kind="resolution" data-id="'+r.id+'">Szczegóły wniosku'+(locked()?'':' i zakończenie głosowania')+'</button></p>';
  return h+'</div>';
}
function glosowanieHtml(){
  const me=curMember();
  const op=openPolls().filter(r=>canVote(me,r)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let h=head('Głosowanie','Wnioski, nad którymi trwa teraz głosowanie online','');
  const pend=pendingVotes();
  if(pend.length)h+='<div class="alertbar"><span class="vwarn" style="color:inherit"><i>!</i>Czeka na Twój głos: '+pend.length+'</span></div>';
  if(!op.length)h+=emptyBox('Brak trwających głosowań',locked()?'Gdy pojawi się wniosek do głosowania, zobaczysz go tutaj.':'Otwórz wniosek w zakładce Uchwały i kliknij „Rozpocznij głosowanie online”.','');
  else h+='<div class="list">'+op.map(voteItem).join('')+'</div>';
  const done=db.resolutions.filter(r=>r.poll&&!r.poll.open&&pollTally(r).total&&canVote(me,r)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
  if(done.length)h+='<h3 class="h3">Ostatnio zakończone</h3><div class="list">'+done.map(r=>{const t=pollTally(r),st=r.status||'przyjeta';return '<div class="card"><b>'+esc(voteTitle(r))+'</b><p class="hint" style="margin:4px 0 0">'+fmtDate(r.date)+' · za '+t.za+', przeciw '+t.przeciw+', wstrz. '+t.wstrz+' · '+(st==='przyjeta'?'przyjęta (uchwała nr '+esc(rno(r))+')':st==='odrzucona'?'odrzucona':'czeka na zatwierdzenie wyniku')+'</p></div>';}).join('')+'</div>';
  return h;
}
function navHtml(){
  const tabs=TABS.filter(t=>(isAdmin()||t[0]!=='ustawienia')&&(canAddNotes()||t[0]!=='notatnik')&&tabAllowed(t[0]));
  return '<nav class="nav" aria-label="Sekcje">'+tabs.map(t=>'<button class="'+t[2]+(ui.tab===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[t[0]]+'</svg>'+(t[0]==='glosowanie'&&pendingVotes().length?'<span class="nbadge" aria-label="Czeka na Twój głos">!</span>':'')+'</span><span class="lbl">'+t[1]+'</span></button>').join('')+'</nav>';
}
const head=(h,sub,btn)=>'<div class="pagehead"><div><h2>'+h+'</h2><p>'+sub+'</p></div>'+(btn||'')+'</div>';
const emptyBox=(t,s,btn)=>'<div class="empty"><b>'+t+'</b>'+s+(btn||'')+'</div>';
function yearBar(){
  return '<div class="chips" style="align-items:center;margin-bottom:14px">'+
    '<button class="btn small" data-act="yprev" aria-label="Poprzedni rok szkolny">‹</button>'+
    '<button class="fchip on" data-act="yall" style="min-width:112px;text-align:center">'+(ui.allYears?'Wszystkie lata':esc(syLabel(viewYear)))+'</button>'+
    '<button class="btn small" data-act="ynext" aria-label="Następny rok szkolny">›</button>'+
    '</div>';
}
function meetingCard(m){
  const C=attCounts(m),t=mtype(m),p=m.date.split('-');
  const sub=[m.place,C.p!==null&&(C.total||C.count)?'obecnych '+C.p+(C.total?' z '+C.total:''):'',(m.resIds||[]).length?'uchwał: '+m.resIds.length:''].filter(Boolean).join(', ');
  const body='<span class="tile"><b>'+p[2]+'</b><small>'+MON[+p[1]-1]+' '+p[0].slice(2)+'</small></span><span class="rb"><span class="rt">'+esc(cap(t.nom))+'</span><span class="rs">'+esc(sub||'Bez dodatkowych informacji')+'</span></span>';
  if(ui.sel&&ui.sel.kind==='meeting'){
    const checked=ui.sel.ids.includes(m.id);
    return '<div class="card row k-meeting selrow'+(checked?' checked':'')+'" data-act="selrow" data-kind="meeting" data-id="'+m.id+'" role="checkbox" aria-checked="'+(checked?'true':'false')+'"><span class="selbox" aria-hidden="true"></span>'+body+'</div>';
  }
  return '<button class="card row k-meeting" data-act="open" data-kind="meeting" data-id="'+m.id+'">'+body+'<span class="chev">›</span></button>';
}
function resCard(r){
  const st=r.status||'przyjeta';
  const sub=fmtDate(r.date)+(r.mode==='wydatek'&&!blank(r.kwota)?', '+money(num(r.kwota))+' zł':'')+(r.poll&&r.poll.open?' · głosowanie w toku':st==='wniosek'?' · czeka na głosowanie':st==='odrzucona'?' · odrzucona':'');
  const tile=st==='wniosek'?'Wniosek':st==='odrzucona'?'Odrzuc.':rno(r);
  const body='<span class="tile wide"><b>'+esc(tile)+'</b></span><span class="rb"><span class="rt">'+esc(subjectOf(r)||'(bez tytułu)')+'</span><span class="rs">'+esc(sub)+'</span></span>';
  if(ui.sel&&ui.sel.kind==='resolution'){
    const checked=ui.sel.ids.includes(r.id);
    return '<div class="card row k-resolution selrow'+(checked?' checked':'')+'" data-act="selrow" data-kind="resolution" data-id="'+r.id+'" role="checkbox" aria-checked="'+(checked?'true':'false')+'"><span class="selbox" aria-hidden="true"></span>'+body+'</div>';
  }
  return '<button class="card row k-resolution" data-act="open" data-kind="resolution" data-id="'+r.id+'">'+body+'<span class="chev">›</span></button>';
}
function bulkSelBar(kind){
  if(!ui.sel||ui.sel.kind!==kind)return '';
  const n=ui.sel.ids.length;
  return '<div class="card" style="margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between">'+
   '<span class="hint" style="margin:0">Zaznaczono: '+n+'</span>'+
   '<div class="moreacts">'+
    (ui.confirm==='bulkdel'?
      '<span class="confirmrow"><span class="chint">Na pewno usunąć ('+n+')?</span><button class="btn warn" data-act="bulkdel">Tak, usuń</button><button class="btn" data-act="bulkdelcancel">Anuluj</button></span>'
      :'<button class="btn warn" data-act="bulkdel"'+(n?'':' disabled')+'>Usuń zaznaczone</button>')+
    '<button class="btn" data-act="bulkselcancel">Zakończ zaznaczanie</button>'+
   '</div></div>';
}
function docCard(d){
  return '<button class="card row k-doc" data-act="open" data-kind="doc" data-id="'+d.id+'"><span class="tile wide"><b>Dok.</b></span><span class="rb"><span class="rt">'+esc(d.title||'(bez tytułu)')+'</span><span class="rs">Aktualizacja: '+fmtDate(d.updated||todayISO())+'</span></span><span class="chev">›</span></button>';
}
function repCard(r){
  const short=r.sy?String(r.sy).replace(/^\d\d(\d\d)\/\d\d(\d\d)$/,'$1/$2'):'';
  return '<button class="card row k-report" data-act="open" data-kind="report" data-id="'+r.id+'"><span class="tile wide"><b>'+esc(short)+'</b></span><span class="rb"><span class="rt">'+esc(REPORT_NAMES[r.type])+'</span><span class="rs">Rok szkolny '+esc(r.sy)+', sporządzono '+fmtDate(r.date)+'</span></span><span class="chev">›</span></button>';
}
function statBox(n,l){return '<div class="stat"><b>'+esc(n)+'</b><span>'+esc(l)+'</span></div>';}

function listHtml(){

  }

  if(ui.tab==='notatnik'&&!canAddNotes())ui.tab=defaultTab();
  if(ui.tab==='pulpit'){
    if(pendingVotes().length)h+='<div class="alertbar" style="margin-top:12px"><span class="vwarn" style="color:inherit"><i>!</i>Czeka na Twój głos: '+pendingVotes().length+'</span><button class="btn small" data-act="tab" data-v="glosowanie">Przejdź do głosowania</button></div>';

  }else{h+= isAdmin()?settingsHtml():emptyBox('Ustawienia','Dostępne tylko dla administratora.','');}
  return h+'</main>';
}
function memberRowAdmin(m){

/* --- render --- */
function render(keepScroll){
  if(ui.editing&&!identified())ui.editing=null;
  if(ui.editing&&isRep(curMember())&&ui.editing.kind!=='doc')ui.editing=null;
  const y=window.scrollY;
  $app.innerHTML=topHtml()+(ui.editing?editHtml():listHtml())+(ui.editing?abarHtml():navHtml());
  if(keepScroll!==false)window.scrollTo(0,y);
  if(ui.editing)refreshPreview();
  if(ui.focusBind){const el=$app.querySelector('[data-bind="'+ui.focusBind+'"]');if(el)el.focus({preventScroll:false});ui.focusBind=null;}
}
function modelFor(){
  const e=ui.editing,r=getRec();if(!r)return null;
  return e.kind==='meeting'?protocolBlocks(r):e.kind==='resolution'?resBlocks(r):e.kind==='doc'?docBlocks(r):reportBlocks(r);
}
function refreshPreview(){
  const el=document.getElementById('sheet');if(!el)return;
  const m=modelFor();if(m)el.innerHTML=toHtml(m);
  const t=document.getElementById('etitle'),r=getRec();if(t&&r)t.textContent=recTitle(ui.editing.kind,r);
}
function updateLive(){
  const e=ui.editing,r=getRec();if(!e||!r)return;
  if(e.kind==='resolution'){const el=document.getElementById('vstat');if(el){const v=voteInfo(r);el.className='vstat '+v.cls;el.textContent=v.text;}}
  if(e.kind==='meeting'){const el=document.getElementById('attc');if(el){const S=attStats(r);el.textContent='Obecnych: '+S.p.length+' z '+S.all.length;}}

}
function setInput(path,v){const el=$app.querySelector('[data-bind="'+path+'"]');if(el)el.value=v;}

/* --- zdarzenia: pola --- */
function onBind(t){
  const rootEl=t.closest('[data-root]');if(!rootEl)return;
  const rk=rootEl.dataset.root;
  if(rk!=='pin'){
    if(ui.readOnly)return;
    if(rk==='evdraft'||rk==='anndraft'){if(!canPlan())return;}
    else if(rk!=='notedraft'&&rk.indexOf('evitem:')!==0&&rk.indexOf('evcontrib:')!==0){
      if(rk.indexOf('member:')===0||rk==='settings'){if(!isAdmin())return;}
      else if(locked())return;
    }
  }
  const root=resolveRoot(rk);if(!root)return;
  const p=t.dataset.bind;
  let v=t.type==='checkbox'?t.checked:(t.dataset.type==='num'?(t.value===''?'':Number(t.value)):t.value);
  setP(root,p,v);
  if(rk==='bulk'){const pv=document.getElementById('bulkprev');if(pv)pv.innerHTML=bulkPrev();return;}
  if(rk==='notedraft'||rk==='pin'||rk==='evdraft'||rk==='anndraft'||rk.indexOf('evitem:')===0)return;
  const e=ui.editing;
  if(e&&e.kind==='resolution'&&root===getRec()){
    const r=root;
    if(p==='date'&&r.date){if(!r.yearT){r.year=syStart(r.date);setInput('year',r.year);}if((r.status||'przyjeta')==='przyjeta'&&!r.numT){r.num=nextNum(r.year,r.id);setInput('num',r.num);}}
    if(p==='year'){r.yearT=true;if((r.status||'przyjeta')==='przyjeta'&&!r.numT){r.num=nextNum(r.year,r.id);setInput('num',r.num);}}
    if(p==='num')r.numT=true;
    if(p==='subject')r.subjT=String(r.subject).trim()!=='';
    if(p==='cel'&&r.mode==='wydatek'&&!r.subjT){r.subject=String(r.cel).trim()?'pokrycia kosztów '+String(r.cel).trim():'';setInput('subject',r.subject);}
    if(p==='manual'&&r.manual&&r.status==='wniosek'){r.status='przyjeta';if(blank(r.num))r.num=nextNum(r.year,r.id);}
  }
  if(e&&e.kind==='report'&&root===getRec()&&p==='meetingId'&&root.meetingId&&!String(root.text||'').trim()){
    const m=db.meetings.find(x=>x.id===root.meetingId);if(m)root.text=meetingSummary(m);
  }
  if(e&&e.kind==='doc'&&root===getRec()){root.updated=todayISO();}
  if(rk.indexOf('dues:')===0&&root){
    const el=document.getElementById('duespct-'+root.id);
    if(el){const s=Number(root.students)||0,pd=Number(root.paid)||0;el.textContent=s>0?(Math.round(pd/s*1000)/10)+'%':'–';}
    const tot=document.getElementById('duestotal');if(tot)tot.outerHTML=duesTotalHtml();
    save();return;
  }
  if(rk.indexOf('evcontrib:')===0){
    const rest=rk.slice(10),i2=rest.indexOf(':'),eid=rest.slice(0,i2);
    const ev=(db.events||[]).find(x=>x.id===eid);
    if(ev){
      const miss=document.getElementById('evmissing-'+eid);
      if(miss){const m=evMissingClasses(ev);miss.outerHTML=evMissingHtml(eid,m);}
      const dl=document.getElementById('evdl-'+eid);
      if(dl)dl.outerHTML=evDlHtml(ev);
    }
    save();return;
  }
  save();
  if(t.dataset.re){render();return;}
  if(ui.editing){refreshPreview();updateLive();}
  else if(rootEl.dataset.root==='settings'&&(p==='school'||p==='logo'))refreshTop();
}
function refreshTop(){const t=$app.querySelector('.top');if(t){const d=document.createElement('div');d.innerHTML=topHtml();const n=d.querySelector('.top');if(n)t.replaceWith(n);}}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.bind&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT')onBind(e.target);});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fileimp'){readImport(t);return;}
  if(t.id==='attimp'){readAttachment(t);return;}
  if(t.dataset&&t.dataset.bind&&(t.type==='checkbox'||t.tagName==='SELECT'))onBind(t);
});

/* --- zdarzenia: akcje --- */
async function getDownloads(){
  if(!window.claude||!window.claude.use)return null;
  try{return await window.claude.use('downloads');}catch(e){return null;}
}
async function getAssets(){
  if(!window.claude||!window.claude.use)return null;
  try{return await window.claude.use('assets');}catch(e){return null;}
}
function readAttachment(inp){
  const f=inp.files&&inp.files[0];if(!f){return;}
  const r=getRec();
  if(!r||ui.editing.kind!=='resolution'){inp.value='';return;}
  if(!/^image\//.test(f.type)&&f.type!=='application/pdf'){toast('Dodaj zdjęcie lub plik PDF.');inp.value='';return;}
  toast('Wysyłanie załącznika…');
  getAssets().then(assets=>{
    if(!assets||typeof assets.upload!=='function'){toast('Załączanie plików działa po odświeżeniu strony.');return;}
    return assets.upload(f).then(a=>{
      r.attachments=r.attachments||[];
      r.attachments.push({id:a.id,url:a.url,name:f.name,contentType:a.contentType||f.type,sizeBytes:a.sizeBytes||f.size});
      save();render();refreshPreview();toast('Dodano załącznik: '+f.name);
    }).catch(e=>{toast('Nie udało się wysłać pliku ('+((e&&e.code)||'błąd')+').');});
  }).catch(()=>{toast('Nie udało się wysłać pliku.');}).finally(()=>{inp.value='';});
}
async function saveFile(data,filename){
  const dl=await getDownloads();
  if(!dl){toast('Pobieranie działa po odświeżeniu strony.');return;}
  try{await dl.save({filename:filename,data:data});toast('Zapisano: '+filename);}
  catch(e){if(e&&e.code==='declined')return;toast('Nie udało się zapisać pliku ('+((e&&e.code)||'błąd')+').');}
}
async function saveDocx(model,title,filename){
  if(!window.docx){toast('Nie wczytał się moduł Worda. Sprawdź internet i odśwież stronę.');return;}
  try{const blob=await docx.Packer.toBlob(toDocx(model,title));await saveFile(blob,filename);}
  catch(e){toast('Nie udało się przygotować dokumentu Word.');}
}
function downloadCurrent(){
  const e=ui.editing,r=getRec();if(!r)return;
  if(e.kind==='meeting')return saveDocx(protocolBlocks(r),'Protokół',asciiName('Protokol_'+r.date)+'.docx');
  if(e.kind==='resolution'){const st=r.status||'przyjeta';return saveDocx(resBlocks(r),st==='przyjeta'?'Uchwała':'Wniosek',asciiName((st==='przyjeta'?'Uchwala_'+r.num+'-'+r.year:'Wniosek')+'_'+r.date)+'.docx');}
  if(e.kind==='doc')return saveDocx(docBlocks(r),r.title||'Dokument',asciiName(r.title||'Dokument')+'.docx');
  return saveDocx(reportBlocks(r),REPORT_NAMES[r.type],asciiName(REPORT_NAMES[r.type]+'_'+String(r.sy).replace('/','-'))+'.docx');
}
function readImport(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  f.text().then(t=>{
    try{const d=JSON.parse(t);if(!d||!Array.isArray(d.meetings)||!Array.isArray(d.resolutions)||!Array.isArray(d.reports)||!Array.isArray(d.members))throw 0;ui.pendingImport=d;render();}
    catch(x){toast('Ten plik nie wygląda na kopię z tej aplikacji.');}
    inp.value='';
  });
}
